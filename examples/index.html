<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>a happy little grove</title>
<style>
  body{margin:0;background:#14181a;color:#dfe6e3;font:16px/1.5 Georgia,serif;padding:32px}
  h1{font-weight:normal;font-size:28px;margin:0 0 4px}
  p.sub{margin:0 0 28px;color:#8fa39c;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
  figure{margin:0;background:#1d2325;padding:8px;border-radius:4px}
  img{width:100%;display:block;border-radius:2px}
  figcaption{font-size:13px;color:#93a7a0;padding-top:6px}
</style></head>
<body>
<h1>a happy little grove</h1>
<p class="sub">Seeded landscapes, painted as SVG. Idea from NaNdi on Rainshare.</p>
<div class="grid">
<figure><img src="lake-1.svg" alt="lake, seed 1"/><figcaption>lake · seed 1</figcaption></figure>
<figure><img src="valley-2.svg" alt="valley, seed 2"/><figcaption>valley · seed 2</figcaption></figure>
<figure><img src="forest-3.svg" alt="forest, seed 3"/><figcaption>forest · seed 3</figcaption></figure>
<figure><img src="cabin-4.svg" alt="cabin, seed 4"/><figcaption>cabin · seed 4</figcaption></figure>
<figure><img src="winter-5.svg" alt="winter, seed 5"/><figcaption>winter · seed 5</figcaption></figure>
<figure><img src="lake-6.svg" alt="lake, seed 6"/><figcaption>lake · seed 6</figcaption></figure>
</div>
</body></html>
